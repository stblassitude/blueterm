name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches Cargo version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "${GITHUB_REF_NAME#v}" = "$version" || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }

  linux:
    needs: check-version
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - run: cargo deb -p blueterm-agent
      - run: cargo deb -p blueterm
      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.arch }}
          path: target/debian/*.deb
          if-no-files-found: error

  macos:
    needs: check-version
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Build universal binary
        run: |
          cargo build --release -p blueterm --target aarch64-apple-darwin
          cargo build --release -p blueterm --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/blueterm \
            target/aarch64-apple-darwin/release/blueterm \
            target/x86_64-apple-darwin/release/blueterm
          lipo -info dist/blueterm
          launchctl plist __TEXT,__info_plist dist/blueterm | grep NSBluetoothAlwaysUsageDescription

      - name: Import signing certificate
        if: env.MACOS_CERT_P12_BASE64 != ''
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/build.keychain-db"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Sign
        if: env.MACOS_CERT_P12_BASE64 != ''
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          identity=$(security find-identity -v -p codesigning | grep "Developer ID Application" | grep "($APPLE_TEAM_ID)" | head -1 | awk '{print $2}')
          test -n "$identity" || { echo "no Developer ID Application identity for team $APPLE_TEAM_ID"; exit 1; }
          codesign --force --timestamp --options runtime \
            --identifier io.github.stblassitude.blueterm \
            --entitlements packaging/macos/entitlements.plist \
            --sign "$identity" dist/blueterm
          codesign --verify --strict --verbose=2 dist/blueterm
          codesign --display --verbose=2 dist/blueterm

      - name: Package
        run: |
          suffix=""
          [ -n "$MACOS_CERT_P12_BASE64" ] || suffix="-unsigned"
          zip="blueterm-${GITHUB_REF_NAME#v}-macos-universal${suffix}.zip"
          (cd dist && ditto -c -k blueterm "../$zip")
          echo "ZIP=$zip" >> "$GITHUB_ENV"

      - name: Notarize
        if: env.MACOS_CERT_P12_BASE64 != ''
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$key"
          xcrun notarytool submit "$ZIP" --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
            --wait --output-format json | tee "$RUNNER_TEMP/notary.json"
          id=$(plutil -extract id raw "$RUNNER_TEMP/notary.json")
          status=$(plutil -extract status raw "$RUNNER_TEMP/notary.json")
          xcrun notarytool log "$id" --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID"
          rm "$key"
          test "$status" = "Accepted"

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: ${{ env.ZIP }}
          if-no-files-found: error

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true

  release:
    needs: [linux, macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags, for the release notes
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"
      - name: Release notes from commits since the previous release
        run: |
          notes="$RUNNER_TEMP/notes.md"
          if prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null); then
            range="$prev..$GITHUB_REF_NAME"
            echo "## Changes since $prev" > "$notes"
          else
            range="$GITHUB_REF_NAME"
            echo "## Changes" > "$notes"
          fi
          echo >> "$notes"
          git log --no-merges --reverse --format='- %s (%h)' "$range" >> "$notes"
          if [ -n "${prev:-}" ]; then
            printf '\n**Full changelog:** %s/%s/compare/%s...%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$prev" "$GITHUB_REF_NAME" >> "$notes"
          fi
          cat "$notes"
          echo "NOTES=$notes" >> "$GITHUB_ENV"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME"
          --notes-file "$NOTES" --verify-tag
