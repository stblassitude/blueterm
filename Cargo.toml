[workspace]
resolver = "3"
members = ["crates/blueterm-proto", "crates/blueterm-agent", "crates/blueterm"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["Stefan Bethke"]
repository = "https://github.com/stblassitude/blueterm"
rust-version = "1.88"

[workspace.dependencies]
blueterm-proto = { path = "crates/blueterm-proto", version = "0.2.0" }
anyhow = "1"
bluer = { version = "0.17", features = ["bluetoothd"] }
btleplug = "0.13"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
rustix = { version = "1", features = ["fs", "process", "pty", "stdio", "system", "termios"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1"
tracing = "0.1"
tracing-journald = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
