[package]
name = "blueterm"
description = "Connect to a blueterm-agent console over Bluetooth Low Energy"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"

[dependencies]
blueterm-proto.workspace = true
anyhow.workspace = true
clap.workspace = true
futures.workspace = true
rustix.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
btleplug.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
bluer.workspace = true

[lints]
workspace = true

[package.metadata.deb]
maintainer = "Stefan Bethke <stb@lassitu.de>"
copyright = "2026 Stefan Bethke"
license-file = ["../../LICENSE", "0"]
section = "utils"
priority = "optional"
depends = "$auto, bluez (>= 5.50)"
extended-description = """\
blueterm connects to a machine running blueterm-agent over Bluetooth Low \
Energy and attaches the local terminal to its login console, like a serial \
console cable."""
assets = [
    ["target/release/blueterm", "usr/bin/", "755"],
    ["../../README.md", "usr/share/doc/blueterm/README.md", "644"],
]
